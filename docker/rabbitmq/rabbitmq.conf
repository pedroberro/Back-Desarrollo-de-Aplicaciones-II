# TLS only (SEC-07): the plain AMQP listener is off, clients connect with amqps on 5671.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/certs/servidor.pem
ssl_options.keyfile = /etc/rabbitmq/certs/servidor.key
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
# Clients authenticate with user and password over TLS, not with certificates.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# Belt and braces: even if a guest account appears, it may only connect from inside the container.
loopback_users.guest = true
