# Render Blueprint: creates the backend web service from this repo.
# Values marked sync: false are asked for in the Render dashboard; never commit them.
services:
  - type: web
    name: planta-libre-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-2), so every query does not cross the continent.
    region: ohio
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Field encryption key (SEC-09). Required: the API does not start without it.
      - key: CIFRADO_CLAVE_ACTUAL
        generateValue: true
      # Signs the charge messages (SEC-08); only read with messaging on.
      - key: MENSAJERIA_FIRMA_SECRETO
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: ALERTAS_EMAIL
        sync: false
      # Mail goes through the Gmail API: the free plan blocks SMTP (ports 25, 465, 587).
      - key: MAIL_PROVIDER
        value: gmail-api
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # The Vercel URL. Vercel forwards the browser's Origin header, so it must be allowed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Asynchronous charging. Turn it on once RABBITMQ_URL points to a hosted broker
      # (e.g. the amqps:// URL of a free CloudAMQP instance).
      - key: MENSAJERIA_HABILITADA
        value: "false"
      - key: RABBITMQ_URL
        sync: false
      - key: SHOW_SQL
        value: "false"
      # Links are still printed in the logs while the Gmail credentials are missing.
      - key: MAIL_LOG_LINKS
        value: "false"
