spring:
  application:
    name: back-daii

  datasource:
    url: jdbc:postgresql://localhost:5432/reservas_espacios
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnly2024!@#$%^&*()}
    expiration-ms: 900000
    header: Authorization
    prefix: "Bearer "
  auth:
    refresh-expiration-days: 30
    reset-expiration-minutes: 30
    cookie-secure: false # Usar true en producción con HTTPS.
    reset-url: ${APP_RESET_URL:http://localhost:5173/reset-password}
    verify-email-url: ${APP_VERIFY_EMAIL_URL:http://localhost:5173/verify-email}
