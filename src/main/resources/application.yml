spring:
  application:
    name: back-daii

  # Local secrets (e.g. MAIL_PASSWORD) live in back/.env, which git ignores. See .env.example.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/reservas_espacios
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:no.reply.planta.libre@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnly2024!@#$%^&*()}
    expiration-ms: 86400000
    header: Authorization
    prefix: "Bearer "

  mail:
    from: "Planta Libre <no.reply.planta.libre@gmail.com>"
    # Also print recovery and confirmation links in the log (handy locally, never in production).
    log-links: ${MAIL_LOG_LINKS:false}

  frontend:
    base-url: http://localhost:5173
