server:
  port: ${PORT:8080}
  # Never tell clients which server or version answers.
  server-header:
  error:
    include-message: never
    include-stacktrace: never
  # Render and Vercel sit in front of the app: trust X-Forwarded-For so the client IP
  # (used by the rate limiter) is the real one and not the proxy's.
  forward-headers-strategy: framework

spring:
  application:
    name: back-daii

  # The API never receives files: a multipart request is rejected instead of parsed.
  servlet:
    multipart:
      enabled: false

  # Local secrets (e.g. MAIL_PASSWORD) live in back/.env, which git ignores. See .env.example.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas_espacios}
    username: ${DB_USERNAME:postgres}
    # No default: credentials never live in the repository (see .env.example).
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Broker of the charge queue. Only used with app.mensajeria.habilitada=true.
  # Locally: docker compose up rabbitmq. In the cloud: the AMQP URL of the provider (amqps://...).
  rabbitmq:
    # Required with messaging on: amqps:// with the app's own account and vhost (SEC-07), e.g.
    # amqps://planta-libre-api:<password>@rabbitmq:5671/planta-libre. No default: no guest, no plain AMQP.
    addresses: ${RABBITMQ_URL:}
    # Publishing runs right after the booking commits, before the HTTP response: an unreachable
    # broker must fail fast instead of holding the request for the client's default 60 s.
    connection-timeout: 5s
    listener:
      simple:
        # A message whose processing fails is not put back at the head of the queue forever:
        # it is retried a few times here and then dead-lettered to planta-libre.cobros.dlq.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:no.reply.planta.libre@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# API contract at /v3/api-docs (OpenAPI 3), used by the contract tests. Error answers are added by
# OpenApiConfig, not taken from the exception handlers.
springdoc:
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false
  default-produces-media-type: application/json

app:
  # Asynchronous charging of bookings through RabbitMQ (see docs/Integracion.md). Off by default
  # so the app still starts without a broker; then bookings stay PENDIENTE until an admin confirms.
  mensajeria:
    habilitada: ${MENSAJERIA_HABILITADA:false}
    # HMAC secret of the charge messages (SEC-08), at least 32 random characters.
    firma-secreto: ${MENSAJERIA_FIRMA_SECRETO:}
    dlq:
      revisar-cada-ms: ${MENSAJERIA_DLQ_REVISAR_CADA_MS:30000}
    # Safety net of the charge (BarridoCobros): every cada-ms, a charge with no answer after
    # espera-segundos is requested again, up to max-reencolados times; then the booking is cancelled.
    barrido:
      cada-ms: ${MENSAJERIA_BARRIDO_CADA_MS:60000}
      espera-segundos: ${MENSAJERIA_BARRIDO_ESPERA_SEGUNDOS:120}
      max-reencolados: ${MENSAJERIA_BARRIDO_MAX_REENCOLADOS:3}

  pasarela:
    # Response time of the simulated payment provider, so the PENDIENTE state is visible in a demo.
    demora-ms: ${PASARELA_DEMORA_MS:1500}

  # Pesos per hour of each space kind; a booking is charged per minute.
  tarifas:
    por-hora:
      CUBICULO: 3500
      SALA_REUNIONES: 9000
      SALA_PRESENTACIONES: 14000
      SALA_CONFERENCIAS: 22000

  jwt:
    # Required, at least 32 random characters: the app refuses to start without it (Secretos).
    secret: ${JWT_SECRET:}
    # Access tokens live 15 minutes (SEC-02); the session goes on with the rotating refresh token.
    expiration-ms: 900000
    refresh-dias: 7
    header: Authorization
    prefix: "Bearer "

  mail:
    # smtp (spring.mail.*, used locally) or gmail-api (HTTPS, for hosts that block SMTP like Render free).
    provider: ${MAIL_PROVIDER:smtp}
    from: "Planta Libre <no.reply.planta.libre@gmail.com>"
    # Also print recovery and confirmation links in the log (handy locally, never in production).
    log-links: ${MAIL_LOG_LINKS:false}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}

  # Field encryption at rest (SEC-09). The current key is required; see CifradoCampos to rotate.
  cifrado:
    clave-actual: ${CIFRADO_CLAVE_ACTUAL:}
    version-actual: ${CIFRADO_VERSION_ACTUAL:v1}
    claves-anteriores: ${CIFRADO_CLAVES_ANTERIORES:}

  alertas:
    # Where operational alerts go (messages in the DLQ). Empty: only the log and the audit trail.
    email: ${ALERTAS_EMAIL:}

  seguridad:
    filtraciones:
      # Ask Have I Been Pwned (k-anonymity) on sign-up and password changes, besides the local list.
      consultar-externo: ${VERIFICAR_FILTRACIONES_HIBP:true}

  # Bookings are stored in the buildings' local time; "now" is taken in this zone even if the
  # server runs in UTC.
  zona-horaria: ${ZONA_HORARIA:America/Argentina/Buenos_Aires}

  demo:
    # Fills the two weeks around today with demo bookings on startup (see DatosDemoInicializador).
    habilitado: ${DEMO_HABILITADO:true}
    # Password of the demo accounts; outside the repository like every other credential.
    password: ${DEMO_PASSWORD:}

  frontend:
    # Used to build the links sent by mail.
    base-url: ${FRONTEND_URL:http://localhost:5173}

  cors:
    # Comma-separated. Not needed when the front proxies /api (Vercel rewrites), kept for direct calls.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
