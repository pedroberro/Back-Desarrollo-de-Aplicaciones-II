server:
  port: ${PORT:8080}
  # Render and Vercel sit in front of the app: trust X-Forwarded-For so the client IP
  # (used by the rate limiter) is the real one and not the proxy's.
  forward-headers-strategy: framework

spring:
  application:
    name: back-daii

  # Local secrets (e.g. MAIL_PASSWORD) live in back/.env, which git ignores. See .env.example.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas_espacios}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Broker of the charge queue. Only used with app.mensajeria.habilitada=true.
  # Locally: docker compose up rabbitmq. In the cloud: the AMQP URL of the provider (amqps://...).
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    # Publishing runs right after the booking commits, before the HTTP response: an unreachable
    # broker must fail fast instead of holding the request for the client's default 60 s.
    connection-timeout: 5s
    listener:
      simple:
        # A message whose processing fails is not put back at the head of the queue forever:
        # it is retried a few times here and then dead-lettered to planta-libre.cobros.dlq.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:no.reply.planta.libre@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # Asynchronous charging of bookings through RabbitMQ (see docs/Integracion.md). Off by default
  # so the app still starts without a broker; then bookings stay PENDIENTE until an admin confirms.
  mensajeria:
    habilitada: ${MENSAJERIA_HABILITADA:false}

  pasarela:
    # Response time of the simulated payment provider, so the PENDIENTE state is visible in a demo.
    demora-ms: ${PASARELA_DEMORA_MS:1500}

  # Pesos per hour of each space kind; a booking is charged per minute.
  tarifas:
    por-hora:
      CUBICULO: 3500
      SALA_REUNIONES: 9000
      SALA_PRESENTACIONES: 14000
      SALA_CONFERENCIAS: 22000

  jwt:
    secret: ${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnly2024!@#$%^&*()}
    expiration-ms: 86400000
    header: Authorization
    prefix: "Bearer "

  mail:
    # smtp (spring.mail.*, used locally) or gmail-api (HTTPS, for hosts that block SMTP like Render free).
    provider: ${MAIL_PROVIDER:smtp}
    from: "Planta Libre <no.reply.planta.libre@gmail.com>"
    # Also print recovery and confirmation links in the log (handy locally, never in production).
    log-links: ${MAIL_LOG_LINKS:false}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}

  # Bookings are stored in the buildings' local time; "now" is taken in this zone even if the
  # server runs in UTC.
  zona-horaria: ${ZONA_HORARIA:America/Argentina/Buenos_Aires}

  demo:
    # Fills the two weeks around today with demo bookings on startup (see DatosDemoInicializador).
    habilitado: ${DEMO_HABILITADO:true}

  frontend:
    # Used to build the links sent by mail.
    base-url: ${FRONTEND_URL:http://localhost:5173}

  cors:
    # Comma-separated. Not needed when the front proxies /api (Vercel rewrites), kept for direct calls.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
