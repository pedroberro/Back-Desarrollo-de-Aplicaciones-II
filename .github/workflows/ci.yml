# Build, unit tests with coverage (JaCoCo) and static analysis (SpotBugs + FindSecBugs) on every
# push, pull request and release tag. `mvn verify` runs all three; see the plugins in pom.xml.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests y análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so SonarCloud can attribute new code.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Reportes de pruebas, cobertura y SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/pit-reports/
          if-no-files-found: ignore

  # Optional: runs once the repository has the SonarCloud variables and token configured.
  sonarcloud:
    name: SonarCloud
    needs: build
    if: ${{ vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Análisis en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true
